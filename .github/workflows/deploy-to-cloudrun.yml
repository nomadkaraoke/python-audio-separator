name: Deploy to Cloud Run

# The `audio-separator` Cloud Run GPU service (us-east4) was SHUT DOWN on
# 2026-10-01 (GCP cost cut) — prod karaoke-gen jobs never used it (they run
# separation in the audio-separation-job GPU Cloud Run Job). Automatic deploys
# on PyPI publish / Dockerfile changes are disabled so releases don't burn
# Cloud Build time or fail against a missing service. To bring it back, first
# re-create the service + repo via karaoke-gen Pulumi
# (`pulumi config set audioSeparatorServiceEnabled true`, see karaoke-gen
# docs/GCP-COST-OPTIMIZATION.md), then run this workflow manually.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Use Cloud Build for the Docker build — it has native x86 with enough
      # RAM to load ML models during the build (baking models into the image).
      - name: Build and push via Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --region=us-east4 \
            --project=nomadkaraoke \
            --substitutions=SHORT_SHA=${GITHUB_SHA::8}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update audio-separator \
            --image="us-east4-docker.pkg.dev/nomadkaraoke/audio-separator/api:${GITHUB_SHA::8}" \
            --region=us-east4 \
            --project=nomadkaraoke \
            --quiet
